<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS OJT Management System - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h2>Create Account</h2>
            <p>Register for the OJT Portal</p>
        </div>
        <form id="registerForm" class="login-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="first_name">First name</label>
                    <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last name</label>
                    <input type="text" id="last_name" name="last_name" autocomplete="family-name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="10" required>
            </div>
            <fieldset class="registration-details">
                <legend>Student information</legend>
                <div class="form-group">
                    <label for="student_number">Student number</label>
                    <input type="text" id="student_number" name="student_number" required>
                </div>
                <div class="form-group">
                    <label for="course">Course / program</label>
                    <input type="text" id="course" name="course" required>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="year_level">Year level</label>
                        <select id="year_level" name="year_level" required>
                            <option value="">Select</option>
                            <option value="1">1st year</option>
                            <option value="2">2nd year</option>
                            <option value="3">3rd year</option>
                            <option value="4">4th year</option>
                            <option value="5">5th year</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="section">Section</label>
                        <input type="text" id="section" name="section">
                    </div>
                </div>
            </fieldset>
            <div id="errorMsg" class="error-message" style="color: red; margin-bottom: 15px; display: none;"></div>
            <button type="submit" class="btn-primary">Register</button>
        </form>
        <div class="login-footer">
            <a href="index.html">Already have an account? Sign In</a>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
