<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to the SAS OJT Management System.">
    <title>Sign in · SAS OJT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
    <main class="login-container">
        <a class="brand-mark" href="index.html">SAS <span>OJT</span></a>
        <div class="login-header">
            <h1>Welcome back</h1>
            <p>Sign in to your OJT account.</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <p id="errorMsg" class="form-error" hidden role="alert"></p>
            <button type="submit" class="btn-primary">Sign in</button>
        </form>
        <div class="login-footer">
            <a href="register.html">Create a student account</a>
            <span aria-hidden="true">·</span>
            <a href="forgot-password.html">Forgot password?</a>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
